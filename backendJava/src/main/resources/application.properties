spring.application.name=jazzmateshop

# Swagger UI 그룹 설정
springdoc.swagger-ui.deep-linking=true
springdoc.group-configs[0].group=user-reviews
springdoc.group-configs[0].paths-to-match=/api/user-reviews/**
springdoc.group-configs[0].packages-to-scan=shop.jazzmate.jazzmateshop.userReview

springdoc.group-configs[1].group=recommendations
springdoc.group-configs[1].paths-to-match=/api/user-reviews/{reviewId}/recommendations
springdoc.group-configs[1].packages-to-scan=shop.jazzmate.jazzmateshop.recommendation

springdoc.group-configs[2].group=critics
springdoc.group-configs[2].paths-to-match=/api/critics/**
springdoc.group-configs[2].packages-to-scan=shop.jazzmate.jazzmateshop.criticsReview

springdoc.group-configs[3].group=musicbrainz
springdoc.group-configs[3].paths-to-match=/api/musicbrainz/**
springdoc.group-configs[3].packages-to-scan=shop.jazzmate.jazzmateshop.musicbrainz
fastapi.base-url=${AI_SERVICE_URL}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
logging.level.org.springframework.web.client=DEBUG
spring.jpa.open-in-view=false

# Supabase PgBouncer(transaction mode) 호환 설정
spring.datasource.hikari.connection-init-sql=SET SESSION CHARACTERISTICS AS TRANSACTION ISOLATION LEVEL READ COMMITTED
# Supabase 서버 측 idle 커넥션 종료(기본 600s)보다 짧게 설정해 끊긴 커넥션 재사용 방지
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=60000
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=false
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.maximum-pool-size=10
