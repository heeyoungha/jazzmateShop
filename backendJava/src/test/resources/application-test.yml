# src/test/resources/application-test.yml
# 테스트 전용 설정

spring:
  datasource:
    url: ${SPRING_TEST_DATASOURCE_URL:jdbc:postgresql://localhost:55432/jazzmate_test}
    username: ${SPRING_TEST_DATASOURCE_USERNAME:jazzmate}
    password: ${SPRING_TEST_DATASOURCE_PASSWORD:jazzmate}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  test:
    database:
      replace: none

fastapi:
  base-url: http://localhost:9999

logging:
  level:
    shop.jazzmate: DEBUG
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
