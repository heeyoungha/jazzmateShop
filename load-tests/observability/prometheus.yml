global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "java-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["java-backend:8080"]

  - job_name: "ai-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["ai-api:8000"]
