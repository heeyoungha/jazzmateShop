---
services:
  # ─────────────────────────────────────────────────────────────
  # Airflow 메타데이터 DB (전용 Postgres 컨테이너)
  # 앱 데이터(Supabase)와 물리적으로 격리 → 장애 범위 분리 + 커넥션 격리.
  # 외부 포트를 열지 않으므로(호스트 노출 X) 내부 전용 크리덴셜은 기본값으로 충분.
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_PG_USER:-airflow}
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD:-airflow}
      POSTGRES_DB: ${AIRFLOW_PG_DB:-airflow}
    volumes:
      - airflow-metadata-db:/var/lib/postgresql/data
    healthcheck:
      # standalone이 DB에 붙기 전에 Postgres가 완전히 뜬 것을 보장
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_PG_USER:-airflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  airflow-standalone:
    # image: 이름을 고정 → 여기서 빌드한 이미지를 deploy/prod.yaml(운영)이 그대로 사용
    image: jazzmateshop-airflow-standalone:latest
    build:
      context: .
      dockerfile: Dockerfile.airflow
    shm_size: '2gb'
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ENV_FILE_PATH:-.env}
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # 메타DB를 전용 Postgres 컨테이너로 지정 (env가 airflow.cfg의 sqlite 값을 덮어씀)
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_PG_USER:-airflow}:${AIRFLOW_PG_PASSWORD:-airflow}@postgres:5432/${AIRFLOW_PG_DB:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
      AIRFLOW__CORE__DAGS_FOLDER: '/opt/airflow/pipeline/dags'
      AIRFLOW_CONFIG: '/opt/airflow/pipeline/config/airflow.cfg'
      PLAYWRIGHT_BROWSERS_PATH: '/home/airflow/.cache/ms-playwright'
      PLAYWRIGHT_CHROMIUM_DISABLE_SANDBOX: '1'
      PYTHONPATH: '/opt/airflow:/opt/airflow/pipeline:/opt/airflow/pipeline/dags'
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CRAWLER_BASE_URL: ${CRAWLER_BASE_URL}
      CRAWLER_REVIEWS_URL: ${CRAWLER_REVIEWS_URL}
    entrypoint: ["/entrypoint-xvfb.sh"]
    command: standalone
    ports:
      - "8081:8080"
    volumes:
      - ${AIRFLOW_PROJ_DIR:-.}/pipeline/dags:/opt/airflow/pipeline/dags
      - ${AIRFLOW_PROJ_DIR:-.}/logs:/opt/airflow/logs
      - ${AIRFLOW_PROJ_DIR:-.}/pipeline/config:/opt/airflow/pipeline/config
      - ${AIRFLOW_PROJ_DIR:-.}/plugins:/opt/airflow/plugins
      - ${AIRFLOW_PROJ_DIR:-.}/pipeline/pipeline_services:/opt/airflow/pipeline/pipeline_services
      - ${AIRFLOW_PROJ_DIR:-.}/data:/opt/airflow/data
      - ${AIRFLOW_PROJ_DIR:-.}/data:/data
      # 메타DB가 Postgres로 나갔으므로 /opt/airflow 통짜 볼륨은 제거.
      # (빈 볼륨이 이미지에 구운 dags/config를 가리는 사고 방지)
    user: "${AIRFLOW_UID:-50000}:0"

volumes:
  airflow-metadata-db:
